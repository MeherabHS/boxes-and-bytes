LESSONS.find(l=>l.id==='singly').ops.push({name:'REVERSE(head)',cost:'O(n)',lines:[['prev ← NULL; cur ← head','prev will end up as the new head.'],['WHILE cur ≠ NULL DO',''],['    nxt ← cur.next','Save the rest of the list first.'],['    cur.next ← prev','Turn this arrow around.'],['    prev ← cur; cur ← nxt','Step forward.'],['RETURN prev','The old last node is the new head.']]});
LESSONS.find(l=>l.id==='doubly').ops.splice(1,0,{name:'INSERT-AFTER(p, x)',cost:'O(1)',lines:[['n ← NEW NODE; n.data ← x','Make the node.'],['n.prev ← p; n.next ← p.next','Wire the newcomer to both neighbours first.'],['IF p.next ≠ NULL THEN p.next.prev ← n','The old successor links back to n.'],['ELSE tail ← n','p was last: n is the new tail.'],['p.next ← n','Finally p links forward to n.']]});
LESSONS.find(l=>l.id==='circular').ops.splice(1,0,{name:'INSERT-FRONT(x) with only tail',cost:'O(1)',lines:[['n ← NEW NODE; n.data ← x','Make the node.'],['IF tail = NULL THEN n.next ← n; tail ← n','First node: a ring of one.'],['ELSE n.next ← tail.next','The newcomer points at the old first node…'],['     tail.next ← n','…and the last node points at the newcomer, the new first node.']]});
LESSONS.find(l=>l.id==='tree').ops.push({name:'BST-DELETE(r, key)',cost:'O(h)',lines:[['IF r = NULL THEN RETURN NULL','Key not found.'],['IF key < r.data THEN r.left ← BST-DELETE(r.left, key)','Search left…'],['ELSE IF key > r.data THEN r.right ← BST-DELETE(r.right, key)','…or right.'],['ELSE IF r.left = NULL THEN t ← r.right; FREE(r); RETURN t','Found with no left child (cases 1 and 2): its right child takes its place.'],['ELSE IF r.right = NULL THEN t ← r.left; FREE(r); RETURN t','Found with no right child: its left child takes its place.'],['ELSE s ← MIN(r.right); r.data ← s.data','Two children (case 3): copy the inorder successor’s value in…'],['     r.right ← BST-DELETE(r.right, s.data)','…then delete that successor from the right subtree.'],['RETURN r','']]},
 {name:'LEVEL-ORDER(root)',cost:'O(n)',lines:[['IF root = NULL THEN RETURN',''],['ENQUEUE(root)','A queue holds the nodes waiting to be visited.'],['WHILE queue not empty DO','Level by level…'],['    n ← DEQUEUE(); VISIT(n)','…take the oldest waiting node…'],['    IF n.left ≠ NULL THEN ENQUEUE(n.left)','…and line up its children.'],['    IF n.right ≠ NULL THEN ENQUEUE(n.right)','']]});

/* ================= progress (this browser only) ================= */
let progress={};try{progress=JSON.parse(localStorage.getItem('frameops-progress')||'{}')||{};}catch(e){progress={};}
const save=()=>{try{localStorage.setItem('frameops-progress',JSON.stringify(progress));}catch(e){}};
const solved=(l,k)=>!!(progress[l]&&progress[l][k]);
function markSolved(l,k){progress[l]=progress[l]||[];progress[l][k]=true;save();renderTabs();}

/* ================= page ================= */
const tabs=document.getElementById('tabs'),app=document.getElementById('app');
document.getElementById('logo').innerHTML=mech(40);
const curId=()=>{const h=location.hash.slice(1);return LESSONS.some(L=>L.id===h)?h:LESSONS[0].id;};
function renderTabs(){const c=curId();tabs.innerHTML=LESSONS.map(L=>{const d=L.labs.filter((_,k)=>solved(L.id,k)).length;return `<a href="#${L.id}" ${L.id===c?'aria-current="page"':''}><span>${L.no} · ${d}/${L.labs.length}</span><b>${L.short}</b></a>`;}).join('');}
const capHtml=s=>md(s).replace(/&lt;(\/?)b&gt;/g,'<$1b>');
function ioHtml(i,o,hide){return `<div class="io"><div class="io-box"><span>SAMPLE INPUT</span><pre>${esc(i)}</pre></div><div class="io-box"><span>SAMPLE OUTPUT</span>${hide?'<pre class="hide">Work it out first</pre>':`<pre>${esc(o)}</pre>`}</div></div>`;}
const pseudoHtml=c=>esc(c).replace(/\b(IF|THEN|ELSE|WHILE|DO|RETURN|REPEAT|UNTIL|TIMES|NEW NODE|NEW|NULL|AND|OR|FREE|MOD|START|VISIT|MAX|UNDERFLOW|OVERFLOW)\b/g,'<span class="kw">$1</span>');
function everyHtml(p){const notes=p.notes||{};return `<details class="every"><summary>Every line, explained</summary><div class="ew"><table>${p.code.split('\n').map((l,k)=>l.trim()?`<tr><td class="n">${k+1}</td><td class="s">${hl(l)}</td><td class="t">${md(notes[k+1]||autoNote(l)||'')}</td></tr>`:'').join('')}</table></div></details>`;}

function buildLesson(L,li){
  const sec=document.createElement('section');sec.className='sortie';sec.hidden=true;
  sec.innerHTML=`
   <div class="brief">
     <div class="hud btext"><div class="code-no">${L.no} // MISSION BRIEFING</div><h1>${L.title}</h1><p class="big">${md(L.big)}</p><ul class="keys">${L.keys.map(k=>`<li><span>${md(k)}</span></li>`).join('')}</ul></div>
     <figure class="hud figure" style="margin:0"><div class="lbl">Tactical view <em>// example</em></div><div class="heap">${L.demo()}</div><figcaption class="cap">${capHtml(L.cap)}</figcaption></figure>
   </div>
   <div class="traps"><h3>⚠ Exam traps</h3><ul>${L.traps.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div>
   ${INTEL[L.id]?`<div class="sec"><h2>Intel: theory</h2><p>Definitions, comparisons, step-by-step diagrams and where each structure is used.</p></div>
   <div class="igrid">${INTEL[L.id].blocks.map(intelHtml).join('')}</div>`:''}
   <div class="sec"><h2>Tactics: pseudocode</h2><p>Each operation in plain steps, with what every line does and how fast it is.</p></div>
   <div class="ops">${L.ops.map(o=>`<article class="hud op"><div class="op-h"><h3>${esc(o.name)}</h3><span class="cost">${esc(o.cost)}</span></div><ol class="pseudo">${o.lines.map(([c,e])=>`<li><span class="pc">${pseudoHtml(c)}</span><span class="pe">${esc(e)}</span></li>`).join('')}</ol></article>`).join('')}</div>
   <div><div class="sec"><h2>Combat sim: the C code</h2><p>Run the real program line by line. The heap view draws every node and arrow as it changes.</p></div>
     <div class="ptabs" role="tablist">${L.progs.map((p,k)=>`<button role="tab" type="button" aria-selected="${k===0}" data-p="${k}"><b>${esc(p.title)}</b><small>${esc(p.short)}</small></button>`).join('')}</div></div>
   ${L.progs.map((p,k)=>`<article class="hud lab" data-panel="${k}" ${k?'hidden':''}><div class="lab-top"><div class="task"><h3>Mission</h3><p>${md(p.task)}</p></div>${ioHtml(p.sampleIn,p.sampleOut)}</div><div class="bh"></div>${everyHtml(p)}</article>`).join('')}
   ${INTEL[L.id]?`<div class="sec"><h2>Exam theory questions</h2><p>Short-answer questions with model answers. Try answering aloud before you open each one.</p></div>
   <div class="qas">${INTEL[L.id].qa.map(([q,a])=>`<details class="qa"><summary>${md(q)}</summary><div>${md(a)}</div></details>`).join('')}</div>`:''}
   <div class="sec"><h2>Field tests</h2><p>Lab-style problems. Answer, then press “Run sim” to watch why.</p></div>
   <div class="tests"></div>
   <nav class="pager">${li>0?`<a class="btn" href="#${LESSONS[li-1].id}">◀ ${LESSONS[li-1].short}</a>`:'<span></span>'}${li<LESSONS.length-1?`<a class="btn go" href="#${LESSONS[li+1].id}">Next sortie: ${LESSONS[li+1].short} ▶</a>`:''}</nav>`;
  const built={};
  const openProg=k=>{sec.querySelectorAll('.ptabs button').forEach(b=>b.setAttribute('aria-selected',String(+b.dataset.p===k)));sec.querySelectorAll('.lab[data-panel]').forEach(a=>a.hidden=+a.dataset.panel!==k);
    if(!built[k]){Bench(sec.querySelector(`.lab[data-panel="${k}"] .bh`),L.progs[k]);built[k]=true;}};
  sec.querySelector('.ptabs').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b)openProg(+b.dataset.p);});
  sec._open=()=>{if(!built[0])openProg(0);};
  const tests=sec.querySelector('.tests');L.labs.forEach((x,k)=>tests.appendChild(buildLab(L,x,k)));
  return sec;
}
function buildLab(L,x,k){
  const id=`t-${L.id}-${k}`,el=document.createElement('article');el.className='hud ex'+(solved(L.id,k)?' solved':'');
  const fill=/⟦/.test(x.code),choice=!!x.options;
  const codeHtml=x.code.split(/⟦(.+?)⟧/).map((p,i)=>i%2?`<input id="${id}" aria-label="Your answer" autocomplete="off" spellcheck="false" size="${Math.max(4,p.length+1)}">`:hl(p)).join('');
  el.innerHTML=`<div class="ex-h"><span class="kind">${x.kind}</span><h3>${esc(x.title)}</h3><span class="tick" ${solved(L.id,k)?'':'hidden'}>✓ CLEARED</span></div>
   <p>${md(x.story)}</p>${x.sampleIn!==undefined?ioHtml(x.sampleIn,x.sampleOut,x.hideOut):''}<p class="q">${md(x.q)}</p>
   <details><summary class="lbl" style="cursor:pointer">Show the full program</summary><pre class="excode">${codeHtml}</pre></details>
   ${choice?`<div class="choices">${x.options.map((o,j)=>`<label for="${id}-${j}"><input type="radio" name="${id}" id="${id}-${j}" value="${j}">${esc(o.c)}</label>`).join('')}</div>`:''}
   ${!fill&&!choice?`<div class="ans"><label for="${id}"><b>Your answer</b></label><input id="${id}" autocomplete="off" spellcheck="false"></div>`:''}
   <div class="acts"><button class="btn go" data-x="check" type="button">Check</button>${x.trace?'<button class="btn" data-x="watch" type="button">▶ Run sim</button>':''}<button class="btn" data-x="reveal" type="button" hidden>Show answer</button></div>
   <div class="fb" hidden aria-live="polite"></div><div class="wv" hidden></div>`;
  if(fill||!x.trace)el.querySelector('details').open=true;
  let wrong=0,built=false;const fb=el.querySelector('.fb');const say=(c,h)=>{fb.className='fb '+c;fb.innerHTML=h;fb.hidden=false;};
  const solCode=x.solution?x.code.replace(/\/\* which [^*]*\*\//,x.solution):x.code.replace(/⟦(.+?)⟧/g,'$1');
  const showRun=()=>{if(!x.trace)return;const h=el.querySelector('.wv');if(!built){Bench(h,{...x,code:solCode});built=true;}h.hidden=false;};
  el.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;const a=b.dataset.x;
    if(a==='watch'){showRun();return;}
    if(a==='reveal'){say('',`<strong>ANSWER</strong><code style="white-space:pre-wrap">${esc(choice?x.options.find(o=>o.ok).c:x.answers[0])}</code><p>${md(x.explain)}</p>`);showRun();return;}
    let ok,why='';
    if(choice){const p=el.querySelector(`input[name="${id}"]:checked`);if(!p){say('','Pick one of the options first.');return;}const o=x.options[+p.value];ok=!!o.ok;why=o.why||'';}
    else{const v=el.querySelector('#'+CSS.escape(id)).value;if(!v.trim()){say('','Type your answer first.');return;}ok=x.answers.map(ansNorm).includes(ansNorm(v));}
    if(ok){say('ok',`<strong>TARGET CLEARED</strong>${md(x.explain)}`);el.classList.add('solved');el.querySelector('.tick').hidden=false;markSolved(L.id,k);Comm.launch(()=>Comm.say('Target cleared. '+x.explain));showRun();}
    else{wrong++;say('bad',`<strong>NEGATIVE</strong>${md(why||('Hint: '+x.hint))}`);Comm.say(wrong>=2?'Still off target. You can press **Show answer**, pilot.':'Negative. Recalculate: read the hint and try again.');if(wrong>=2)el.querySelector('[data-x=reveal]').hidden=false;}});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input:not([type=radio])')){e.preventDefault();el.querySelector('[data-x=check]').click();}});
  return el;
}
const sections=LESSONS.map((L,i)=>{const s=buildLesson(L,i);app.appendChild(s);return s;});
function show(scroll){const id=curId(),L=LESSONS.find(l=>l.id===id);sections.forEach((s,i)=>{s.hidden=LESSONS[i].id!==id;if(!s.hidden)s._open();});renderTabs();if(scroll)window.scrollTo({top:0,behavior:'auto'});
  Comm.launch(()=>Comm.say(L.hello));}
window.addEventListener('hashchange',()=>show(true));
show(false);
</script>
