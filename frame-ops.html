<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Data structures in C: memory, linked lists, queues and binary search trees, with theory, pseudocode and step-by-step code.">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Frame Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: a mobile-suit cockpit. Sortie tabs on top; each sortie = mission briefing,
   pseudocode tactics, a combat-sim bench (heap view on top, code + stack below), field tests.
   Single dark HUD look by design. */
:root{
  color-scheme:dark;
  --bg:#060a12; --panel:#0c1424; --panel2:#101b31; --line:#1d3456; --ink:#d8e5ff; --muted:#7f95ba;
  --cyan:#3fe0ff; --cyan-soft:rgba(63,224,255,.12); --amber:#ffb640; --amber-soft:rgba(255,182,64,.14);
  --red:#ff4d5e; --red-soft:rgba(255,77,94,.14); --green:#4dffa6; --green-soft:rgba(77,255,166,.13); --blue:#2f6bff;
  --armor:#e9eef8; --edge:#0b1220; --code:#070d18;
  --f-display:"Orbitron","Eurostile","Segoe UI",sans-serif;
  --f-body:"Rajdhani","Segoe UI",system-ui,sans-serif;
  --f-mono:"Share Tech Mono","Consolas",ui-monospace,monospace;
  --cut:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;color:var(--ink);font:500 18px/1.55 var(--f-body);background-color:var(--bg);
  background-image:radial-gradient(ellipse at 20% -10%,rgba(47,107,255,.22),transparent 55%),radial-gradient(ellipse at 100% 30%,rgba(63,224,255,.08),transparent 45%),
  linear-gradient(rgba(63,224,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(63,224,255,.045) 1px,transparent 1px);
  background-size:auto,auto,34px 34px,34px 34px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:30;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.35}
.wrap{max-width:1300px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:800;letter-spacing:.04em;line-height:1.15;margin:0;text-wrap:balance;text-transform:uppercase}
p{margin:0}
code{font-family:var(--f-mono);font-size:.92em;color:var(--cyan);background:var(--cyan-soft);padding:0 .3em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hud{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);clip-path:var(--cut);position:relative}
.hud::after{content:"";position:absolute;top:0;left:18px;width:64px;height:3px;background:var(--cyan)}
.lbl{font:600 .72rem var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);display:flex;gap:8px;align-items:center}
.lbl::before{content:"";width:8px;height:8px;background:var(--cyan);clip-path:polygon(0 0,100% 50%,0 100%)}
.lbl em{font-style:normal;color:var(--muted);letter-spacing:.06em}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:rgba(9,15,28,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-height:64px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font:800 1.05rem var(--f-display);letter-spacing:.12em;color:var(--ink);text-decoration:none}
.brand small{display:block;font:500 .62rem var(--f-mono);letter-spacing:.2em;color:var(--green)}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1 1 auto;padding-block:2px}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:7px 16px 6px;font:600 .74rem var(--f-display);letter-spacing:.1em;border:1px solid var(--line);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);background:var(--panel);display:grid;line-height:1.25}
.tabs a b{color:var(--ink);font-weight:600}
.tabs a span{font:500 .62rem var(--f-mono);letter-spacing:.12em}
.tabs a[aria-current="page"]{background:var(--cyan);color:var(--edge);border-color:var(--cyan)}
.tabs a[aria-current="page"] b{color:var(--edge)}

/* briefing */
.sortie{display:grid;gap:30px;padding-block:26px 150px}
.brief{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:stretch}
.brief>*{min-width:0}
.btext{padding:22px 24px;display:grid;gap:12px;align-content:start}
.code-no{font:600 .78rem var(--f-mono);letter-spacing:.24em;color:var(--amber)}
.btext h1{font-size:clamp(1.8rem,4.2vw,2.9rem);color:var(--armor)}
.btext .big{font-size:1.15rem;max-width:62ch}
.keys{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:7px}
.keys li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px}
.keys li::before{content:"";width:10px;height:10px;margin-top:8px;background:var(--amber);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.figure{padding:22px 20px 18px;display:grid;gap:14px;align-content:space-between}
.figure .cap{font-size:1rem;color:var(--muted)}
.figure .cap b{color:var(--amber);font-weight:700}
.traps{padding:18px 22px;background:linear-gradient(180deg,rgba(255,182,64,.09),rgba(255,182,64,.03));border:1px solid var(--amber);clip-path:var(--cut);position:relative}
.traps::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:repeating-linear-gradient(-45deg,var(--amber) 0 10px,var(--edge) 10px 20px)}
.traps h3{font-size:1rem;color:var(--amber);margin:6px 0 8px;letter-spacing:.14em}
.traps ul{margin:0;padding-left:1.2em;display:grid;gap:5px}
.sec{display:grid;gap:4px}
.sec h2{font-size:1.35rem;color:var(--armor)}
.sec p{color:var(--muted)}

/* pseudocode */
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
.op{padding:16px 18px 14px;display:grid;gap:10px;min-width:0}
.op-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.op-h h3{font-size:.95rem;color:var(--cyan);letter-spacing:.1em}
.cost{font:600 .8rem var(--f-mono);color:var(--edge);background:var(--green);padding:1px 8px}
.pseudo{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:ps}
.pseudo li{counter-increment:ps;display:grid;grid-template-columns:2em minmax(0,1.1fr) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--line);align-items:start}
.pseudo li::before{content:counter(ps);font:600 .8rem var(--f-mono);color:var(--muted);text-align:right;padding-top:2px}
.pseudo .pc{font:15px/1.5 var(--f-mono);white-space:pre-wrap;color:var(--armor);overflow-wrap:anywhere}
.pseudo .pc .kw{color:var(--amber)}
.pseudo .pe{font-size:.98rem;color:var(--muted)}

/* program tabs + lab sheet */
.ptabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ptabs button{border:1px solid var(--line);background:var(--panel);padding:8px 16px;cursor:pointer;text-align:left;display:grid;line-height:1.25;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.ptabs button b{font:600 .78rem var(--f-display);letter-spacing:.08em}
.ptabs button small{color:var(--muted);font-size:.85rem}
.ptabs button[aria-selected="true"]{border-color:var(--cyan);background:var(--cyan-soft)}
.lab{padding:20px;display:grid;gap:16px;min-width:0}
.lab>*{min-width:0}
.lab-top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.task h3{font-size:1.05rem;color:var(--armor);margin-bottom:6px}
.io{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.io-box{border:1px solid var(--line);background:var(--code);min-width:0}
.io-box span{display:block;font:600 .66rem var(--f-display);letter-spacing:.16em;padding:5px 10px;color:var(--amber);border-bottom:1px solid var(--line)}
.io-box pre{margin:0;padding:8px 10px;font:15px/1.45 var(--f-mono);white-space:pre-wrap;word-break:break-word;color:var(--green)}
.io-box pre.hide{color:var(--muted);font-family:var(--f-body)}

/* bench */
.bench{display:grid;gap:12px}
.bench>*{min-width:0}
.inrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:12px 14px;border:1px dashed var(--line);background:rgba(12,20,36,.7)}
.inrow label{display:grid;gap:4px;color:var(--muted);font-size:.95rem;flex:1 1 230px}
.inrow textarea{font:16px/1.45 var(--f-mono);background:var(--code);color:var(--green);border:1px solid var(--line);padding:7px 10px;resize:vertical;width:100%;min-height:2.6em}
.inerr{width:100%;color:var(--red)}
.btn{border:1px solid var(--line);background:var(--panel2);padding:8px 14px;font:600 .74rem var(--f-display);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);color:var(--ink)}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.go{background:var(--amber);border-color:var(--amber);color:var(--edge)}
.btn.go:hover{color:var(--edge);filter:brightness(1.08)}
.btn.cy{background:var(--cyan);border-color:var(--cyan);color:var(--edge)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.heapview{padding:16px 16px 14px;display:grid;gap:10px}
.heap{display:grid;gap:12px;min-width:0}
.chainwrap{overflow-x:auto;padding-bottom:4px}
.chain{display:flex;align-items:center;gap:6px;width:max-content;min-height:96px}
.side{display:grid;gap:6px;padding-top:8px;border-top:1px dashed var(--line)}
.side .lbl{color:var(--amber)}.side .lbl::before{background:var(--amber)}
.side .chain{min-height:0;flex-wrap:wrap;width:auto}
.rootcap,.nullcap,.loopcap{font:600 .8rem var(--f-mono);padding:6px 10px;border:1px dashed var(--muted);color:var(--muted);white-space:nowrap}
.rootcap{border-style:solid;border-color:var(--cyan);color:var(--cyan);display:grid;text-align:center;line-height:1.3}
.rootcap span{color:var(--ink);font-size:.75rem}
.nullcap{color:var(--red);border-color:var(--red)}
.loopcap{color:var(--green);border-color:var(--green)}
.loopbar{margin-top:6px;font:600 .78rem var(--f-mono);color:var(--green);border:1px solid var(--green);border-top:none;padding:2px 10px;width:max-content;max-width:100%}
.link{font:700 1.4rem var(--f-mono);color:var(--cyan)}
.link.two{color:var(--green)}
.node{display:grid;gap:3px;justify-items:center}
.bdgs{display:flex;gap:4px;min-height:20px;flex-wrap:wrap;justify-content:center}
.bdg{font:600 .7rem var(--f-mono);padding:1px 6px;color:var(--edge);background:var(--cyan)}
.bdg.amber{background:var(--amber)}
.nbody{border:2px solid var(--line);background:var(--code);padding:4px 6px 6px;display:grid;gap:3px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.naddr{font:.7rem var(--f-mono);color:var(--muted);text-align:center}
.flds{display:flex;gap:3px}
.fld{display:grid;justify-items:center;border:1px solid var(--line);padding:2px 7px;min-width:48px}
.fld span{font:.64rem var(--f-mono);color:var(--muted);text-transform:uppercase}
.fld b{font:600 1rem var(--f-mono);color:var(--armor);font-weight:400}
.fld.chg{border-color:var(--green);background:var(--green-soft);animation:pulse .5s}
.node.hl .nbody{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-soft),0 0 18px rgba(255,182,64,.35)}
.node.new .nbody{animation:deploy .45s}
.node.freed{opacity:.45}
.node.freed .nbody{border-color:var(--red);border-style:dashed}
.node.freed .naddr::after{content:" · FREED";color:var(--red)}
@keyframes pulse{0%{transform:scale(.85)}100%{transform:scale(1)}}
@keyframes deploy{0%{transform:translateY(-14px);opacity:0}100%{transform:none;opacity:1}}
.treewrap{overflow-x:auto}
svg.tree{display:block}
svg.tree .edge{stroke:var(--cyan);stroke-width:2;opacity:.7}
svg.tree .nd{fill:var(--code);stroke:var(--line);stroke-width:2}
svg.tree .nd.hl{stroke:var(--amber);stroke-width:3}
svg.tree .nd.vis{fill:rgba(77,255,166,.18);stroke:var(--green)}
svg.tree .nd.new{stroke:var(--green);stroke-width:3}
svg.tree .val{fill:var(--armor);font:16px var(--f-mono);text-anchor:middle;dominant-baseline:central}
svg.tree .ad{fill:var(--muted);font:9px var(--f-mono);text-anchor:middle}
svg.tree .tag{font:600 10px var(--f-mono);text-anchor:middle}
svg.tree .tag.cyan{fill:var(--cyan)}svg.tree .tag.amber{fill:var(--amber)}
.detail{display:flex;gap:10px;flex-wrap:wrap}
.bgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start}
.left,.right{display:grid;gap:12px;min-width:0}
.code{background:var(--code);border:1px solid var(--line);padding:10px 0;overflow-x:auto;font:15px/1.65 var(--f-mono);max-height:560px;overflow-y:auto}
.ln{display:grid;grid-template-columns:2.8em max-content;min-width:100%;width:max-content;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:0 14px 0 0;cursor:pointer;white-space:pre;font:inherit;color:#c9d6ef}
.ln .num{color:#4d6286;text-align:right;padding-right:12px;user-select:none}
.ln:hover{background:rgba(63,224,255,.06)}
.ln.cur{background:rgba(255,182,64,.16);border-left-color:var(--amber)}
.ln.cur .num{color:var(--amber)}
.ln.peek{outline:1px dashed var(--cyan);outline-offset:-2px}
.t-kw{color:#ff8fa0}.t-type{color:#7fd3ff}.t-str{color:#ffd27a}.t-num{color:#c6a6ff}.t-com{color:#5c7398;font-style:italic}.t-fn{color:#78ffc4}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl .next{flex:1 1 140px;font-size:.82rem;padding:11px 16px}
.prog{display:flex;align-items:center;gap:10px;width:100%;font:.85rem var(--f-mono);color:var(--muted)}
.bar{flex:1;height:6px;background:var(--panel);border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .2s}
.tact{padding:14px 16px;display:grid;gap:8px;border:1px solid var(--amber);background:linear-gradient(180deg,rgba(255,182,64,.08),rgba(12,20,36,.6));clip-path:var(--cut)}
.tact .th{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tact .th .lbl{color:var(--amber)}.tact .th .lbl::before{background:var(--amber)}
.tact .th code{background:none;color:var(--armor);white-space:pre-wrap;padding:0}
.tact .now{font-size:1.1rem;line-height:1.5}
.tact .about{font-size:.98rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px}
.tact .about b{color:var(--ink)}
.panel{padding:12px 14px;border:1px solid var(--line);background:rgba(12,20,36,.75)}
.panel .lbl{margin-bottom:8px}
.tape{display:grid;gap:5px;font:15px var(--f-mono)}
.tline{display:flex;flex-wrap:wrap;gap:5px}
.tok{padding:1px 8px;border:1px solid var(--line);color:var(--ink)}
.tok.used{opacity:.35;text-decoration:line-through}
.tok.just{background:var(--amber);color:var(--edge);border-color:var(--amber);opacity:1;text-decoration:none}
.tok.next{border-color:var(--cyan);border-style:dashed}
.frames{display:grid;gap:8px}
.frame{border:1px solid var(--line);padding:8px 10px}
.frame.active{border-color:var(--cyan);box-shadow:inset 3px 0 0 var(--cyan)}
.fh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:.8rem var(--f-mono);color:var(--muted);margin-bottom:4px}
.fh b{color:var(--ink);font-weight:400;font-size:.95rem}
.frame.active .fh span{color:var(--cyan)}
.sv{display:grid;grid-template-columns:minmax(4.5em,auto) auto minmax(0,1fr);gap:8px;align-items:baseline;font:15px var(--f-mono);padding:2px 0}
.sv .sn{color:var(--armor)}
.sv .st{color:var(--muted);font-size:.78rem}
.sv .sval{color:var(--green);font-weight:400}
.sv .sval.null{color:var(--red)}
.sv .sval.junk{color:var(--muted)}
.sv .sval small{color:var(--muted)}
.sv.chg .sval{background:var(--green-soft);animation:pulse .5s}
.empty{color:var(--muted);font-style:italic}
.screen pre{margin:0;background:var(--code);border:1px solid var(--line);padding:8px 10px;font:15px/1.5 var(--f-mono);color:var(--green);min-height:2.6em;white-space:pre-wrap;word-break:break-word}
.screen pre.none{color:var(--muted)}
.done{margin-top:8px;padding:7px 10px;font:600 .8rem var(--f-display);letter-spacing:.08em}
.done.ok{background:var(--green-soft);border:1px solid var(--green);color:var(--green)}
.done.info{border:1px solid var(--line);color:var(--muted)}
details.every summary{cursor:pointer;font:600 .8rem var(--f-display);letter-spacing:.1em;color:var(--cyan);padding:6px 0}
.ew{overflow-x:auto}
.ew table{border-collapse:collapse;width:100%;font-size:1rem}
.ew td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
.ew td.n{font:.8rem var(--f-mono);color:var(--muted);text-align:right;width:2.6em}
.ew td.s{font:14px/1.5 var(--f-mono);white-space:pre;background:var(--code);color:#c9d6ef;min-width:16em}
.ew td.t{min-width:16em;color:var(--muted)}
.ew td.t code{color:var(--cyan)}

/* field tests */
.tests{display:grid;gap:16px}
.ex{padding:18px 20px;display:grid;gap:12px;min-width:0}
.ex>*{min-width:0}
.ex.solved{border-color:var(--green)}
.ex.solved::after{background:var(--green)}
.ex-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.kind{font:600 .66rem var(--f-display);letter-spacing:.14em;color:var(--edge);background:var(--cyan);padding:3px 8px}
.ex-h h3{font-size:1rem;color:var(--armor);flex:1 1 14em}
.tick{color:var(--green);font:600 .74rem var(--f-display);letter-spacing:.1em}
.q{font-weight:700;color:var(--armor)}
.excode{background:var(--code);border:1px solid var(--line);padding:10px 14px;font:15px/1.65 var(--f-mono);white-space:pre;overflow-x:auto;margin:0;color:#c9d6ef}
.excode input{font:15px var(--f-mono);background:#1a2a48;color:var(--amber);border:1px dashed var(--amber);padding:0 5px}
.ans{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ans input{font:16px var(--f-mono);padding:7px 10px;background:var(--code);color:var(--green);border:1px solid var(--line);width:16em;max-width:100%}
.choices{display:grid;gap:8px}
.choices label{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);cursor:pointer;font:15px var(--f-mono);overflow-x:auto;white-space:pre}
.choices label:has(input:checked){border-color:var(--cyan);background:var(--cyan-soft)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.fb{padding:10px 14px;border:1px solid var(--line)}
.fb.ok{border-color:var(--green);background:var(--green-soft)}
.fb.bad{border-color:var(--red);background:var(--red-soft)}
.fb strong{display:block;font:600 .8rem var(--f-display);letter-spacing:.1em;margin-bottom:2px}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pager a{text-decoration:none}

/* KESTREL: comm panel + launch */
.comm{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
.comm>*{pointer-events:auto}
.msg{max-width:min(320px,calc(100vw - 120px));background:rgba(9,15,28,.96);border:1px solid var(--cyan);clip-path:var(--cut);padding:10px 30px 12px 14px;position:relative;box-shadow:0 0 24px rgba(63,224,255,.25)}
.msg .mh{font:600 .66rem var(--f-display);letter-spacing:.16em;color:var(--cyan);margin-bottom:4px}

<body>

<header class="topbar"><div class="wrap bar-in">
  <a class="brand" href="#memory"><span id="logo" aria-hidden="true"></span><span>FRAME OPS<small>DATA STRUCTURE COMBAT SIM</small></span></a>
  <nav class="tabs" id="tabs" aria-label="Sorties"></nav>
  <a class="part" href="./">◀ C basics with Mochi</a>
</div></header>
<main class="wrap" id="app"></main>

<script>
/* ================= helpers ================= */
const R=String.raw;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function md(s){const c=[];s=esc(s).replace(/«([^»]+)»/g,(m,x)=>{c.push(x);return '\u0001'+(c.length-1)+'\u0001';});
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
  return s.replace(/\u0001(\d+)\u0001/g,(m,k)=>'<code>'+c[k]+'</code>');}
function hl(src){
  const re=/(\/\/.*$|\/\*.*?\*\/)|(#include|#define)|(<\w+\.h>)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(int|char|struct)\b|\b(return|for|while|if|else|do)\b|\b(NULL|\d+)\b|\b([A-Za-z_]\w*)(?=\s*\()/g;
  let o='',l=0,m;while((m=re.exec(src))){o+=esc(src.slice(l,m.index));
    const c=m[1]?'com':m[2]?'kw':m[3]?'str':m[4]?'str':m[5]?'type':m[6]?'kw':m[7]?'num':'fn';
    o+=`<span class="t-${c}">${esc(m[0])}</span>`;l=re.lastIndex;}
  return o+esc(src.slice(l));
}
const clone=o=>JSON.parse(JSON.stringify(o));
const hex=a=>a===null?'NULL':a===undefined?'?':'0x'+a.toString(16).toUpperCase();
const outNorm=s=>String(s).replace(/[ \t]+$/gm,'').replace(/\n+$/,'');
const ansNorm=s=>String(s).trim().replace(/;$/,'').replace(/\s+/g,'').replace(/^['"](.*)['"]$/,'$1').toLowerCase();
function tokenize(s){const o=[];String(s).replace(/\r/g,'').split('\n').forEach((l,li)=>l.split(/\s+/).filter(Boolean).forEach(w=>o.push({w,li})));return o;}

/* ================= the simulator ================= */
const I=v=>({k:'int',v});
const C=v=>({k:'char',v});
const P=v=>({k:'ptr',v});
class Sim{
  constructor(input='',{globals=false}={}){this.toks=tokenize(input);this.pos=0;this.just=[];this.steps=[];this.frames=[];this.heap={};this.na=0x1A0;this.out='';this.ch=[];
    if(globals)this.frame('globals');this.frame('main()');}
  frame(n){this.frames.push({name:n,vars:[]});}
  pop(){this.frames.pop();}
  set(name,v,fi){const k=fi===undefined?this.frames.length-1:fi;const f=this.frames[k];const i=f.vars.findIndex(x=>x.name===name);const e={name,...v};if(i<0)f.vars.push(e);else f.vars[i]=e;this.ch.push(k+':'+name);}
  get(name,fi){const k=fi===undefined?this.frames.length-1:fi;const v=this.frames[k].vars.find(x=>x.name===name);return v?v.v:undefined;}
  del(name){const f=this.frames[this.frames.length-1];f.vars=f.vars.filter(v=>v.name!==name);}
  read(){const t=this.toks[this.pos];this.just.push(this.pos);this.pos++;return t?t.w:'';}
  print(s){this.out+=s;}
  malloc(fields){const a=this.na;this.na+=0x20;this.heap[a]={addr:a,...fields};this.ch.push('n'+a);return a;}
  node(a,patch){Object.assign(this.heap[a],patch);for(const k in patch)this.ch.push('n'+a+'.'+k);}
  free(a){this.heap[a].freed=true;this.ch.push('n'+a);}
  step(line,now,hl){this.steps.push({line,now,frames:clone(this.frames),heap:clone(this.heap),out:this.out,ch:this.ch.slice(),hl:hl===undefined||hl===null?[]:[].concat(hl).filter(x=>x!==null&&x!==undefined),pos:this.pos,just:this.just.slice()});this.ch=[];this.just=[];}
}
const START=R`Launch. The program starts in «main».`;
const END=R`«return 0;» Mission complete: the program ends with no errors.`;
const D=(t,a)=>t.heap[a].data;

/* ================= drawing ================= */
const BASE=f=>f.name==='main()'||f.name==='globals';
function findVar(s,name){for(const f of s.frames){const v=f.vars.find(x=>x.name===name);if(v)return v.v;}return undefined;}
function badgeMap(s,skip){
  const m={},add=(a,name,tone)=>{if(typeof a!=='number')return;(m[a]=m[a]||[]).push({name,tone});};
  const base=s.frames.filter(BASE),top=s.frames[s.frames.length-1];
  base.forEach(f=>f.vars.forEach(v=>{if(v.k==='ptr'&&v.name!==skip)add(v.v,v.name,'cyan');}));
  if(!BASE(top))top.vars.forEach(v=>{if(v.k!=='ptr')return;if(base.some(f=>f.vars.some(b=>b.name===v.name&&b.v===v.v)))return;add(v.v,v.name,'amber');});
  return m;
}
const pv=v=>v===undefined?'?':v===null?'NULL':hex(v);
function nodeHtml(n,s,badges,view,freed){
  const ch=k=>s.ch.includes('n'+n.addr+(k?'.'+k:''));
  const f=(label,val,k)=>`<div class="fld ${ch(k)?'chg':''}"><span>${label}</span><b>${val}</b></div>`;
  const dv=v=>v===null||v===undefined?'?':esc(v);
  const fields=view==='dlist'?f('prev',pv(n.prev),'prev')+f('data',dv(n.data),'data')+f('next',pv(n.next),'next')
    :view==='tree'?f('left',pv(n.left),'left')+f('data',dv(n.data),'data')+f('right',pv(n.right),'right')
    :f('data',dv(n.data),'data')+f('next',pv(n.next),'next');
  const bs=(badges[n.addr]||[]).map(b=>`<span class="bdg ${b.tone}">${esc(b.name)}</span>`).join('');
  return `<div class="node ${s.hl.includes(n.addr)?'hl':''} ${ch('')&&!freed?'new':''} ${freed?'freed':''}"><div class="bdgs">${bs||'&nbsp;'}</div><div class="nbody"><div class="naddr">${hex(n.addr)}</div><div class="flds">${fields}</div></div></div>`;
}
function listHtml(s,view,root){
  const H=s.heap,rootA=findVar(s,root),badges=badgeMap(s,root);
  const chain=[],seen=new Set();let cur=rootA,circ=false;
  while(typeof cur==='number'&&H[cur]&&!H[cur].freed){if(seen.has(cur)){circ=true;break;}seen.add(cur);chain.push(cur);cur=H[cur].next;}
  const live=Object.values(H).filter(n=>!n.freed&&!seen.has(n.addr)),freed=Object.values(H).filter(n=>n.freed);
  let h=`<div class="chainwrap"><div class="chain"><div class="rootcap">${esc(root)}<span>${pv(rootA)}</span></div><span class="link">→</span>`;
  if(view==='dlist'&&chain.length)h+=`<div class="nullcap">NULL</div><span class="link two">←</span>`;
  if(!chain.length)h+=`<div class="nullcap">${rootA===null?'NULL · empty':rootA===undefined?'? junk':'freed '+hex(rootA)}</div>`;
  chain.forEach((a,i)=>{h+=nodeHtml(H[a],s,badges,view);if(i<chain.length-1){const b=chain[i+1];const two=view==='dlist'&&H[b].prev===a;h+=`<span class="link ${two?'two':''}">${two?'⇄':'→'}</span>`;}});
  if(chain.length){h+=`<span class="link">→</span>`+(circ?`<div class="loopcap">${hex(cur)}${cur===rootA?' = '+esc(root):''}</div>`:`<div class="nullcap">${cur===null?'NULL':cur===undefined?'? junk':'freed '+hex(cur)}</div>`);}
  h+='</div>'+(circ?`<div class="loopbar">↺ the last node points back to the first: there is no NULL</div>`:'')+'</div>';
  if(live.length)h+=`<div class="side"><div class="lbl">Not linked into the chain</div><div class="chain">${live.map(n=>nodeHtml(n,s,badges,view)).join('')}</div></div>`;
  if(freed.length)h+=`<div class="side"><div class="lbl">Freed memory</div><div class="chain">${freed.map(n=>nodeHtml(n,s,badges,view,true)).join('')}</div></div>`;
  return h;
}
function treeHtml(s,root){
  const H=s.heap,rootA=findVar(s,root),badges=badgeMap(s);
  const pos={},order=[],seen=new Set();let maxD=0;
  const walk=(a,d)=>{if(typeof a!=='number'||!H[a]||H[a].freed||seen.has(a))return;seen.add(a);walk(H[a].left,d+1);pos[a]={i:order.length,d};order.push(a);maxD=Math.max(maxD,d);walk(H[a].right,d+1);};
  walk(rootA,0);
  let h=`<div class="chain" style="min-height:0"><div class="rootcap">${esc(root)}<span>${pv(rootA)}</span></div></div>`;
  if(order.length){
    const W=order.length*66+20,HH=(maxD+1)*78+30,X=a=>10+pos[a].i*66+33,Y=a=>34+pos[a].d*78;
    let svg='';
    order.forEach(a=>['left','right'].forEach(k=>{const c=H[a][k];if(pos[c]!==undefined)svg+=`<line class="edge" x1="${X(a)}" y1="${Y(a)}" x2="${X(c)}" y2="${Y(c)}"/>`;}));
    order.forEach(a=>{const n=H[a];const cls=['nd',s.hl.includes(a)?'hl':'',n.vis?'vis':'',s.ch.includes('n'+a)?'new':''].join(' ');
      const tags=(badges[a]||[]).map(b=>b).filter(b=>b.name!==root||true);
      svg+=`<circle class="${cls}" cx="${X(a)}" cy="${Y(a)}" r="21"/><text class="val" x="${X(a)}" y="${Y(a)}">${n.data===null||n.data===undefined?'?':esc(n.data)}</text><text class="ad" x="${X(a)}" y="${Y(a)+32}">${hex(a)}</text>`;
      tags.forEach((b,j)=>{svg+=`<text class="tag ${b.tone}" x="${X(a)}" y="${Y(a)-27-j*11}">${esc(b.name)}</text>`;});});
    h+=`<div class="treewrap"><svg class="tree" viewBox="0 0 ${W} ${HH+8}" width="${W}" height="${HH+8}" role="img" aria-label="Binary search tree">${svg}</svg></div>`;
  }else h+=`<div class="nullcap" style="width:max-content">${rootA===null?'NULL · empty tree':'?'}</div>`;
  const focus=[...new Set(s.hl)].filter(a=>H[a]&&!H[a].freed);
  if(focus.length)h+=`<div class="side"><div class="lbl">Node detail</div><div class="detail">${focus.map(a=>nodeHtml(H[a],s,badges,'tree')).join('')}</div></div>`;
  const loose=Object.values(H).filter(n=>!n.freed&&!seen.has(n.addr)&&!focus.includes(n.addr));
  if(loose.length)h+=`<div class="side"><div class="lbl">Not linked into the tree yet</div><div class="detail">${loose.map(n=>nodeHtml(n,s,badges,'tree')).join('')}</div></div>`;
  return h;
}
function stackHtml(s){
  const last=s.frames.length-1;
  return s.frames.map((f,i)=>({f,i})).reverse().map(({f,i})=>{
    const rows=f.vars.map(v=>{const chg=s.ch.includes(i+':'+v.name);let val,cls='';
      if(v.k==='ptr'){val=pv(v.v);cls=v.v===null?'null':v.v===undefined?'junk':'';const n=typeof v.v==='number'&&s.heap[v.v];if(n&&!n.freed)val+=` <small>→ node(${n.data===null||n.data===undefined?'?':esc(n.data)})</small>`;if(n&&n.freed)val+=' <small>(freed!)</small>';}
      else if(v.k==='arr'){val='{'+v.v.join(', ')+'}';}
      else if(v.k==='char'){val=v.v===null?'?':`'${esc(v.v)}'`;cls=v.v===null?'junk':'';}
      else{val=v.v===null?'?':esc(v.v);cls=v.v===null?'junk':'';}
      return `<div class="sv ${chg?'chg':''}"><span class="sn">${esc(v.name)}</span><span class="st">${v.k==='ptr'?'Node*':v.k==='arr'?'int['+v.v.length+']':v.k}</span><b class="sval ${cls}">${val}</b></div>`;}).join('');
    const cap=f.name==='globals'?'global variables':i===last?(i===0||s.frames[i-1].name==='globals'?'running':'running · called by '+s.frames[i-1].name):'paused';
    return `<div class="frame ${i===last?'active':''}"><div class="fh"><b>${esc(f.name)}</b><span>${cap}</span></div>${rows||'<p class="empty">no variables yet</p>'}</div>`;
  }).join('');
}
function tapeHtml(toks,s){
  if(!toks.length)return '<p class="empty">no input</p>';
  const lines=[];toks.forEach((t,k)=>{(lines[t.li]=lines[t.li]||[]).push(`<span class="tok ${s.just.includes(k)?'just':k<s.pos?'used':k===s.pos?'next':''}">${esc(t.w)}</span>`);});
  return lines.filter(Boolean).map(l=>`<div class="tline">${l.join('')}</div>`).join('');
}
function autoNote(line){const s=line.trim();
  if(!s)return R`An empty line. C ignores it; it only makes the code easier to read.`;
  if(s==='#include <stdio.h>')return R`Brings in «scanf» and «printf».`;
  if(s==='#include <stdlib.h>')return R`Brings in «malloc» (reserve heap memory) and «free» (give it back).`;
  if(s==='int main() {')return R`The program starts running here.`;
  if(s==='return 0;')return R`Ends main: “finished, no errors”.`;
  if(s==='}')return R`Closing brace: the end of the block above.`;
  if(s==='} else {')return R`Ends the «if» part; «else» runs when the test was false.`;
  if(s==='};')return R`Ends the struct design. It needs the «;».`;
  if(s==='struct Node {')return R`Designs a node: a small box that holds data plus pointer field(s) to other nodes.`;
  if(s==='int data;')return R`The value this node carries.`;
  if(s==='struct Node *next;')return R`The address of the next node (or «NULL» if there is none). A struct may point to its own type.`;
  if(s==='struct Node *prev;')return R`The address of the previous node (or «NULL»).`;
  if(s==='struct Node *left;')return R`The address of the left child: every value in that subtree is smaller.`;
  if(s==='struct Node *right;')return R`The address of the right child: every value in that subtree is bigger or equal.`;
  return '';}

function arrayHtml(s){
  const q=findVar(s,'q')||[],f=findVar(s,'front'),r=findVar(s,'rear'),c=findVar(s,'count')||0,N=q.length,inq=new Set();
  for(let k=0;k<c;k++)inq.add((f+k)%N);
  return `<div class="arr">${q.map((v,i)=>`<div class="acell ${inq.has(i)?'in':''} ${s.hl.includes(i)?'hl':''} ${s.ch.includes('a'+i)?'chg':''}"><div class="atags">${i===f?'<span class="bdg">front</span>':''}${i===r?'<span class="bdg amber">rear</span>':''}</div><div class="abox">${esc(v)}</div><div class="aidx">[${i}]</div></div>`).join('')}</div>
  <p class="anote">Bright cells are in the queue (count = ${c}). Dim cells hold old values that no longer count. Indexes wrap: (4 + 1) % 5 = 0.</p>`;
}
function mkList(t,vals,view){const a=vals.map(v=>t.malloc(view==='dlist'?{data:v,prev:null,next:null}:{data:v,next:null}));
  a.forEach((x,i)=>{if(i<a.length-1)t.heap[x].next=a[i+1];if(view==='dlist'&&i>0)t.heap[x].prev=a[i-1];});if(view==='clist'&&a.length)t.heap[a[a.length-1]].next=a[0];t.ch=[];return a;}
function mkTree(t,vals){let r=null;const m={};vals.forEach(v=>{r=bstAdd(t,r,v);m[v]=t.na-0x20;});t.ch=[];return [r,m];}
function storyHtml(st){
  return `<div class="story">${st.steps.map(([cap],k)=>{const t=new Sim('');const ctx=st.base(t)||{};t.ch=[];for(let j=0;j<k;j++){st.steps[j][1](t,ctx);}t.ch=[];ctx.hl=[];st.steps[k][1](t,ctx);t.step(0,'',ctx.hl);
    const v=st.view==='tree'?treeHtml(t.steps[0],st.root):listHtml(t.steps[0],st.view,st.root);
    return `<div class="frame-s"><div class="sn">STEP ${k+1}</div><p>${md(cap)}</p><div class="heap">${v}</div></div>`;}).join('')}</div>`;
}
function intelHtml(b){
  if(b.t==='text')return `<div class="hud icard"><h3>${esc(b.title)}</h3>${b.body.map(x=>`<p>${md(x)}</p>`).join('')}</div>`;
  if(b.t==='list')return `<div class="hud icard"><h3>${esc(b.title)}</h3><ul>${b.items.map(x=>`<li>${md(x)}</li>`).join('')}</ul></div>`;
  if(b.t==='table')return `<div class="hud icard"><h3>${esc(b.title)}</h3><div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  if(b.t==='story')return `<div class="hud icard" style="grid-column:1/-1"><h3>${esc(b.title)}</h3>${storyHtml(b)}</div>`;
  return '';
}

/* ================= KESTREL (original mech) ================= */
function mech(size=64,cls=''){
  const e='var(--edge)';
  return `<svg class="mech ${cls}" width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">

let benchN=0;
function Bench(host,prog,opts={}){
  const id='b'+(++benchN);let steps=[],idx=0,peek=null,timer=null,toks=[],input=prog.sampleIn,last=0,seen={};let speed=1;
  const lines=prog.code.split('\n');
  host.innerHTML=`<div class="bench">
    <form class="inrow" novalidate><label for="${id}-in">Keyboard input (edit it and run again)<textarea id="${id}-in" rows="${Math.min(7,Math.max(1,prog.sampleIn.split('\n').length))}" spellcheck="false">${esc(prog.sampleIn)}</textarea></label>

    <div class="hud heapview"><div class="lbl">${prog.view==='array'?'Array <em>// global int q[5]</em>':'Heap <em>// nodes and arrows</em>'}</div><div class="heap"></div></div>
    <div class="bgrid">

        <div class="ctrl"><button class="btn" data-a="reset" type="button" aria-label="Restart">↺</button><button class="btn" data-a="back" type="button">◀ Back</button>
          <button class="btn go next" data-a="next" type="button">Next line ▶</button><button class="btn" data-a="play" type="button">Auto</button><button class="btn" data-a="speed" type="button">1×</button>
          <div class="prog"><span class="count"></span><div class="bar"><i></i></div></div></div>
        <div class="tact" aria-live="polite"></div>
      </div>
      <div class="right">
        <div class="panel"><div class="lbl">Keyboard <em>// yellow = just read</em></div><div class="tape"></div></div>
        <div class="panel"><div class="lbl">Stack <em>// variables in each function</em></div><div class="frames"></div></div>
        <div class="panel screen"><div class="lbl">Screen</div><pre></pre><div class="done" hidden></div></div>
      </div>
    </div></div>`;
  const q=s=>host.querySelector(s),ta=q('textarea'),err=q('.inerr');
  const view=s=>prog.view==='tree'?treeHtml(s,prog.root):prog.view==='array'?arrayHtml(s):listHtml(s,prog.view,prog.root);
  function run(text){const e=prog.check(tokenize(text).map(t=>t.w));if(e){err.textContent=e+' Fix the input and run again.';err.hidden=false;return;}
    err.hidden=true;input=text;toks=tokenize(text);steps=prog.trace(text);idx=0;peek=null;last=0;seen={};render();}
  function react(a,b,matched){
    const born=Object.keys(b.heap).filter(k=>!a.heap[k]);const died=Object.keys(b.heap).filter(k=>b.heap[k].freed&&!a.heap[k].freed);
    if(born.length&&!seen.born){seen.born=1;Comm.say(R`New node deployed at «${hex(+born[0])}». «malloc» reserved it on the heap.`);return;}
    if(died.length){Comm.say(R`Node «${hex(+died[0])}» decommissioned. «free» returned its memory. Do not touch that address again.`);return;}
    if(b.frames.length>a.frames.length&&!seen.call){seen.call=1;Comm.say(R`Entering «${b.frames[b.frames.length-1].name}»: a new stack frame with its own variables.`);return;}
    if(idx===steps.length-1)Comm.say(matched?'Mission complete. The screen matches the Sample Output.':'Run finished. Try your own input next, pilot.');
  }
  function render(){
    const s=steps[idx],ln=peek??s.line;
    host.querySelectorAll('.ln').forEach(b=>{const n=+b.dataset.line;b.classList.toggle('cur',n===s.line);b.classList.toggle('peek',peek!==null&&n===peek&&n!==s.line);});
    const about=(prog.notes||{})[ln]||autoNote(lines[ln-1]||'');
    q('.tact').innerHTML=`<div class="th"><span class="lbl">Line ${ln}</span><code>${hl((lines[ln-1]||'').trim())}</code></div>`+
      (peek!==null&&peek!==s.line?`<p class="now">${md(about)}</p><p class="about">You are reading line ${peek}. The program is still on line ${s.line}; press <b>Next line</b> to continue.</p>`
      :`<p class="now">${md(s.now)}</p>${about?`<p class="about"><b>About this line:</b> ${md(about)}</p>`:''}`);
    q('.heap').innerHTML=view(s);q('.tape').innerHTML=tapeHtml(toks,s);q('.frames').innerHTML=stackHtml(s);
    const pre=q('.screen pre');pre.textContent=s.out||'(nothing printed yet)';pre.classList.toggle('none',!s.out);
    const done=q('.done');let matched=false;
    if(idx===steps.length-1){matched=outNorm(input)===outNorm(prog.sampleIn)&&outNorm(s.out)===outNorm(prog.sampleOut);
      done.className='done '+(matched?'ok':'info');done.textContent=matched?'MISSION COMPLETE · output matches the Sample Output':'RUN FINISHED · try another input';done.hidden=false;}else done.hidden=true;
    if(idx===last+1)react(steps[last],s,matched);last=idx;
    q('.count').textContent=`${idx+1}/${steps.length}`;q('.bar i').style.width=((idx+1)/steps.length*100)+'%';
    q('[data-a=back]').disabled=idx===0;q('[data-a=next]').disabled=idx===steps.length-1;q('[data-a=play]').textContent=timer?'Pause':'Auto';
  }
  const stop=()=>{if(timer){clearInterval(timer);timer=null;}};
  const go=d=>{stop();peek=null;idx=Math.max(0,Math.min(steps.length-1,idx+d));render();};
  const play=()=>{stop();timer=setInterval(()=>{if(idx>=steps.length-1){stop();render();return;}idx++;render();},1600/speed);render();};
  host.addEventListener('click',e=>{const ln=e.target.closest('.ln');if(ln){peek=+ln.dataset.line;render();return;}
    const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='next')go(1);else if(a==='back')go(-1);else if(a==='reset'){stop();idx=0;peek=null;last=0;render();}
    else if(a==='sample'){stop();ta.value=prog.sampleIn;run(prog.sampleIn);}
    else if(a==='speed'){speed=speed===1?2:speed===2?4:1;b.textContent=speed+'×';if(timer)play();}
    else if(a==='play'){if(timer){stop();render();return;}if(idx===steps.length-1)idx=0;peek=null;play();}});
  host.addEventListener('keydown',e=>{if(e.target.matches('textarea,input'))return;if(e.key==='ArrowRight'){e.preventDefault();go(1);}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}});
  q('form').addEventListener('submit',e=>{e.preventDefault();stop();run(ta.value);});
  run(prog.sampleIn);
}

const LIST_HEAD=R`#include <stdio.h>

struct Node {

const TREE_HEAD=R`#include <stdio.h>
#include <stdlib.h>

struct Node {
    int data;
    struct Node *left;
    struct Node *right;
};

struct Node *insert(struct Node *r, int x) {
    if (r == NULL) {
        struct Node *nd = malloc(sizeof(struct Node));
        nd->data = x;
        nd->left = nd->right = NULL;
        return nd;
    }
    if (x < r->data) {
        r->left = insert(r->left, x);
    } else {
        r->right = insert(r->right, x);
    }
    return r;
}
`;
const INSERT_NOTES={10:R`Recursive insert. It returns the root of the (sub)tree after inserting, so the caller can re-link it.`,
  11:R`Base case: an empty spot. This is where the new value belongs.`,12:R`Reserve a new node on the heap.`,13:R`Store the value.`,14:R`A new node has no children yet: both pointers «NULL».`,15:R`Hand the new node back; the caller links it in.`,
  17:R`The BST rule: smaller values go into the **left** subtree.`,18:R`Insert into the left subtree and store whatever root comes back in «r->left».`,20:R`Bigger (or equal) values go into the **right** subtree.`,22:R`This node stays where it is: return it unchanged.`};

/* ---- singly: traced helpers ---- */
function sInsertEnd(t,head,x){
  t.frame('insertEnd()');t.set('head',P(head));t.set('x',I(x));t.step(9,R`insertEnd gets a copy of the head pointer («${hex(head)}») and «x = ${x}».`,head);
  const a=t.malloc({data:null,next:undefined});t.set('n',P(a));t.step(10,R`«malloc» reserves a new node on the heap at «${hex(a)}». Its fields hold junk for now.`,a);
  t.node(a,{data:x});t.step(11,R`«n->data = ${x}». The arrow «->» follows the pointer to the node and opens its «data» field.`,a);
  t.node(a,{next:null});t.step(12,R`«n->next = NULL»: this node will be the last, so it points nowhere.`,a);
  if(head===null){t.step(13,R`Is «head == NULL»? **Yes**, the list is empty.`,a);t.step(14,R`The new node becomes the whole list: return «${hex(a)}».`,a);t.pop();return a;}
  t.step(13,R`Is «head == NULL»? No, the list already has nodes.`,head);
  let cur=head;t.set('cur',P(cur));t.step(16,R`«cur» starts at the first node.`,cur);
  while(t.heap[cur].next!==null){t.step(17,R`Is «cur->next» («${hex(t.heap[cur].next)}») «!= NULL»? Yes, there is another node after this one.`,cur);
    cur=t.heap[cur].next;t.set('cur',P(cur));t.step(18,R`«cur = cur->next»: move one node along, to «${hex(cur)}» (data ${D(t,cur)}).`,cur);}
  t.step(17,R`«cur->next» is «NULL»: cur is the last node.`,cur);
  t.node(cur,{next:a});t.step(20,R`«cur->next = n»: the old last node now points at the new node. It joins the chain!`,[cur,a]);
  t.step(21,R`Return the same head «${hex(head)}»: the first node did not change.`);t.pop();return head;
}
function sPrint(t,head){
  t.frame('printList()');t.set('head',P(head));t.step(42,R`printList gets the head pointer.`,head);
  let c=0;t.set('count',I(0));t.step(43,R`«count» starts at 0.`);let cur=head;t.set('cur',P(cur));t.step(44,R`«cur» starts at the head.`,cur);
  while(cur!==null){t.step(45,R`Is «cur» («${hex(cur)}») «!= NULL»? Yes.`,cur);const d=D(t,cur);t.print(`${d} -> `);t.step(46,R`Prints «${d} -> ».`,cur);
    cur=t.heap[cur].next;t.set('cur',P(cur));t.step(47,R`«cur = cur->next» → «${hex(cur)}».`,cur);c++;t.set('count',I(c));t.step(48,R`«count» → «${c}».`,cur);}
  t.step(45,R`«cur» is «NULL»: we walked off the end of the list. Loop over.`);t.print('NULL\n');t.step(50,R`Prints «NULL» and a new line.`);
  t.step(51,R`Returns the count, «${c}». (main ignores it here.)`);t.pop();
}
function sDelete(t,head,key){
  t.frame('deleteKey()');t.set('head',P(head));t.set('key',I(key));t.step(24,R`deleteKey gets the head pointer and «key = ${key}».`,head);
  let cur=head,prev=null;t.set('cur',P(cur));t.set('prev',P(null));t.step(25,R`«cur» starts at the head. «prev» (the node just before cur) starts as «NULL».`,cur);
  while(cur!==null&&D(t,cur)!==key){t.step(26,R`«cur» is not NULL and its data «${D(t,cur)}» is not «${key}». Keep walking.`,cur);
    prev=cur;t.set('prev',P(prev));t.step(27,R`«prev = cur»: remember this node.`,cur);cur=t.heap[cur].next;t.set('cur',P(cur));t.step(28,R`«cur = cur->next» → «${hex(cur)}».`,cur);}
  if(cur===null){t.step(26,R`«cur» is «NULL»: we reached the end without finding «${key}».`);t.step(30,R`Is «cur == NULL»? Yes.`);t.step(31,R`Nothing to delete: return head unchanged.`);t.pop();return head;}
  t.step(26,R`Found it: «cur->data» is «${key}». The loop stops.`,cur);t.step(30,R`Is «cur == NULL»? No, there is a node to remove.`,cur);
  if(prev===null){t.step(33,R`Is «prev == NULL»? **Yes**: we are deleting the very first node.`,cur);head=t.heap[cur].next;t.set('head',P(head));t.step(34,R`«head = cur->next»: the second node becomes the new head.`,[cur,head]);}
  else{t.step(33,R`Is «prev == NULL»? No: there is a node before cur.`,[prev,cur]);t.node(prev,{next:t.heap[cur].next});t.step(36,R`«prev->next = cur->next»: the node before now skips over cur. cur is cut out of the chain.`,[prev,cur]);}
  t.free(cur);t.step(38,R`«free(cur)» gives the node’s memory back. It is shown crossed out under Freed memory.`);
  t.step(39,R`Return «${hex(head)}» as the head.`,head);t.pop();return head;

/* ---- queue: traced helpers ---- */
function qEnq(t,x){
  t.frame('enqueue()');t.set('x',I(x));t.step(11,R`enqueue gets «x = ${x}».`);
  const a=t.malloc({data:null,next:undefined});t.set('nd',P(a));t.step(12,R`A new node at «${hex(a)}».`,a);t.node(a,{data:x});t.step(13,R`«nd->data = ${x}».`,a);t.node(a,{next:null});t.step(14,R`«nd->next = NULL»: it will be the last in line.`,a);
  const rear=t.get('rear',0);
  if(rear===null){t.step(15,R`Is «rear == NULL»? **Yes**: the queue is empty.`,a);t.set('front',P(a),0);t.set('rear',P(a),0);t.step(16,R`«front = rear = nd»: the only node is both the front and the back of the line.`,a);}
  else{t.step(15,R`Is «rear == NULL»? No: there is already a line.`,rear);t.node(rear,{next:a});t.step(18,R`«rear->next = nd»: the unit at the back now points at the newcomer.`,[rear,a]);t.set('rear',P(a),0);t.step(19,R`«rear = nd»: the newcomer is now at the back.`,a);}
  t.step(21,R`Returns ${x}.`);t.pop();
}
function qDeq(t){
  t.frame('dequeue()');t.step(24,R`dequeue starts.`);const front=t.get('front',0);
  if(front===null){t.step(25,R`Is «front == NULL»? **Yes**: the queue is empty (underflow).`);t.step(26,R`Returns «-1» to signal “nothing to dequeue”.`);t.pop();return -1;}
  t.step(25,R`Is «front == NULL»? No.`,front);t.set('t',P(front));t.step(28,R`«t» remembers the front node so we can free it after unlinking.`,front);
  const x=D(t,front);t.set('x',I(x));t.step(29,R`Save its value: «x = ${x}».`,front);
  const nf=t.heap[front].next;t.set('front',P(nf),0);t.step(30,R`«front = front->next»: the next unit in line (${hex(nf)}) moves to the front.`,nf);
  if(nf===null){t.step(31,R`Is «front == NULL»? **Yes**: the queue is now empty.`);t.set('rear',P(null),0);t.step(32,R`So «rear = NULL» too. Otherwise rear would still point at the node we are about to free.`);}
  else t.step(31,R`Is «front == NULL»? No, units are still waiting.`,nf);
  t.free(front);t.step(34,R`«free(t)»: the old front node’s memory is returned.`);t.step(35,R`Returns «${x}».`);t.pop();return x;
}
const QUEUE_CODE=R`#include <stdio.h>
#include <stdlib.h>

struct Node {
    int data;
    struct Node *next;
};

struct Node *front = NULL, *rear = NULL;

int enqueue(int x) {
    struct Node *nd = malloc(sizeof(struct Node));
    nd->data = x;
    nd->next = NULL;
    if (rear == NULL) {
        front = rear = nd;
    } else {
        rear->next = nd;
        rear = nd;
    }
    return x;
}

int dequeue() {
    if (front == NULL) {
        return -1;
    }
    struct Node *t = front;
    int x = t->data;
    front = front->next;
    if (front == NULL) {
        rear = NULL;
    }
    free(t);
    return x;
}

int main() {
    int q, x;
    char op;
    scanf("%d", &q);
    for (int i = 0; i < q; i++) {
        scanf(" %c", &op);
        if (op == 'E') {
            scanf("%d", &x);
            enqueue(x);
        } else {
            printf("Dequeued %d\n", dequeue());
        }
    }
    printf("Queue:");
    for (struct Node *p = front; p != NULL; p = p->next) {
        printf(" %d", p->data);
    }
    printf("\n");
    return 0;
}`;
function queueTrace(inp){
  const t=new Sim(inp,{globals:true});t.set('front',P(null),0);t.set('rear',P(null),0);
  t.step(38,R`The global pointers «front» and «rear» start as «NULL»: an empty queue. The program starts in «main».`);
  t.set('q',I(null));t.set('x',I(null));t.step(39,R`Boxes for the number of commands and a value.`);t.set('op',C(null));t.step(40,R`A char box for the command letter.`);
  const q=+t.read();t.set('q',I(q));t.step(41,R`«q = ${q}» commands follow.`);
  for(let i=0;i<q;i++){t.set('i',I(i));t.step(42,i===0?R`Loop starts: «i = 0».`:R`«i++» → «i = ${i}». Is «${i} < ${q}»? Yes.`);
    const op=t.read();t.set('op',C(op));t.step(43,R`scanf reads the command «'${op}'». The space in «" %c"» skips the line break before it.`);
    if(op==='E'){t.step(44,R`«op» is «'E'»: enqueue.`);const x=+t.read();t.set('x',I(x));t.step(45,R`Reads the value «${x}».`);t.step(46,R`Call «enqueue(${x})».`);qEnq(t,x);t.step(46,R`Back in main. «${x}» joined the back of the queue.`,t.get('rear',0));}
    else{t.step(44,R`«op» is not «'E'».`);t.step(48,R`printf needs «dequeue()» first.`);const v=qDeq(t);t.print(`Dequeued ${v}\n`);t.step(48,R`Screen: «Dequeued ${v}».`,t.get('front',0));}}
  t.set('i',I(q));t.step(42,R`«i = ${q}»: all commands done.`);t.del('i');
  t.print('Queue:');t.step(51,R`Prints «Queue:».`);let p=t.get('front',0);t.set('p',P(p));t.step(52,R`«p» starts at «front».`,p);
  while(p!==null){const d=D(t,p);t.print(' '+d);t.step(53,R`Prints « ${d}».`,p);p=t.heap[p].next;t.set('p',P(p));t.step(52,R`«p = p->next» → «${hex(p)}».${p===null?' p is NULL: done.':''}`,p);}

struct Node *insertEnd(struct Node *head, int x) {
    struct Node *n = malloc(sizeof(struct Node));
    n->data = x;
    n->next = NULL;
    if (head == NULL) {
        return n;
    }
    struct Node *cur = head;
    while (cur->next != NULL) {
        cur = cur->next;
    }
    cur->next = n;
    return head;
}

struct Node *deleteKey(struct Node *head, int key) {
    struct Node *cur = head, *prev = NULL;
    while (cur != NULL && cur->data != key) {
        prev = cur;
        cur = cur->next;
    }
    if (cur == NULL) {
        return head;
    }
    if (prev == NULL) {
        head = cur->next;
    } else {
        prev->next = cur->next;
    }
    free(cur);
    return head;
}

int printList(struct Node *head) {
    int count = 0;
    struct Node *cur = head;
    while (cur != NULL) {
        printf("%d -> ", cur->data);
        cur = cur->next;
        count++;
    }
    printf("NULL\n");
    return count;
}

   code:R`#include <stdio.h>
#define N 5

int q[N];
int front = 0, rear = -1, count = 0;

int enqueue(int x) {
    if (count == N) {
        printf("Overflow\n");
        return 0;
    }
    rear = (rear + 1) % N;
    q[rear] = x;
    count++;
    return 1;
}

int dequeue() {
    if (count == 0) {
        printf("Underflow\n");
        return -1;
    }
    int x = q[front];
    front = (front + 1) % N;
    count--;
    return x;
}

int main() {
    int ops, x;
    char c;
    scanf("%d", &ops);
    for (int i = 0; i < ops; i++) {
        scanf(" %c", &c);
        if (c == 'E') {
            scanf("%d", &x);
            enqueue(x);
        } else {
            x = dequeue();
            if (x != -1) {
                printf("Dequeued %d\n", x);
            }
        }
    }
    printf("front = %d, rear = %d, count = %d\n", front, rear, count);
    return 0;
}`,

int inorder(struct Node *r) {
    if (r == NULL) {
        return 0;
    }
    int c = inorder(r->left);
    printf(" %d", r->data);
    return c + 1 + inorder(r->right);
}

int search(struct Node *r, int key) {
    while (r != NULL && r->data != key) {
        if (key < r->data) {
            r = r->left;
        } else {
            r = r->right;
        }
    }
    return r != NULL;
}

int main() {
    int n, x, key;
    scanf("%d", &n);
    struct Node *root = NULL;
    for (int i = 0; i < n; i++) {
        scanf("%d", &x);
        root = insert(root, x);
    }
    printf("Inorder:");
    int count = inorder(root);
    printf("\nNodes = %d\n", count);
    scanf("%d", &key);
    if (search(root, key)) {
        printf("Found %d\n", key);
    } else {
        printf("%d not found\n", key);
    }
    return 0;
}`,

  {kind:'Fill the gap',title:'Search path',story:'Mission control wants the route a search takes through the hangar rail.',sampleIn:'6\n50 30 70 20 40 60\n40',sampleOut:'Path: 50 30 40 (found)',q:'Which way should the search go for a smaller key?',view:'tree',root:'root',

int main() {
    int n, x, key;
    scanf("%d", &n);

        scanf("%d", &x);
        root = insert(root, x);

    struct Node *r = root;
    printf("Path:");

        printf(" %d", r->data);
        if (key < r->data) {
            r = r->⟦left⟧;
        } else {
            r = r->right;
        }
    }
    if (r != NULL) {
        printf(" %d (found)\n", r->data);
    } else {
        printf(" (not found)\n");
    }
    return 0;
}`,answers:['left'],hint:'In a BST, smaller values live on one particular side.',explain:R`Smaller keys are in the LEFT subtree, so «r = r->left».`,

  {t:'list',title:'Pointer vocabulary',items:[
    R`**Address**: where a value lives in memory (shown here like «0x1A0»).`,
    R`**Pointer**: a variable that stores an address. «struct Node *p;»`,
    R`**Dereference**: follow the address. «*p» is the whole node, «p->data» is one field.`,
    R`**NULL**: a pointer value meaning “points nowhere”. Following NULL crashes the program.`,
    R`**Dangling pointer**: still holds an address that has been freed.`,
    R`**Memory leak**: heap memory nobody points to any more, so it can never be freed.`,
    R`**Self-referential structure**: a struct that contains a pointer to its own type, like «struct Node *next;». Every structure in this course is one.`]},

  {t:'text',title:'Abstract data type (ADT)',body:[R`An ADT describes **what** a structure does: its operations and their rules. It does not say **how** it is built. A *queue* is an ADT (enqueue, dequeue, FIFO). A queue built from a linked list, or from a circular array, is an **implementation** of it.`,R`Exams often ask you to “define the ADT”: list the data it stores and each operation with what it does.`]},
  {t:'story',title:'Storyboard: the life of one node',view:'list',root:'p',base:t=>{t.set('p',P(undefined));return {};},steps:[
    [R`«struct Node *p;» A pointer on the stack. It holds junk: it points nowhere valid yet.`,(t,c)=>{}],
    [R`«p = malloc(sizeof(struct Node));» A node appears on the heap; p holds its address.`,(t,c)=>{c.a=t.malloc({data:null,next:undefined});ptrOn(t,'p',c.a);c.hl=[c.a];}],
    [R`«p->data = 42; p->next = NULL;» Every field set: no junk left.`,(t,c)=>{t.node(c.a,{data:42,next:null});c.hl=[c.a];}],
    [R`«free(p);» The memory is returned. p still holds the old address: **dangling**.`,(t,c)=>{t.free(c.a);}],
    [R`«p = NULL;» Now p safely points nowhere.`,(t,c)=>{ptrOn(t,'p',null);}]]},
  {t:'story',title:'Storyboard: how a memory leak happens',view:'list',root:'p',base:t=>({}),steps:[
    [R`«p = malloc(...)» → node A at the address in p.`,(t,c)=>{c.a=t.malloc({data:1,next:null});ptrOn(t,'p',c.a);}],
    [R`«p = malloc(...)» again → node B. Node A is still reserved, but no pointer holds its address: it is **leaked**.`,(t,c)=>{c.b=t.malloc({data:2,next:null});ptrOn(t,'p',c.b);}],
    [R`«free(p)» frees only B. A can never be freed. Fix: «free» A before reusing p, or keep a second pointer.`,(t,c)=>{t.free(c.b);}]]}],
 qa:[
  [R`What is the difference between stack and heap memory?`,R`The stack holds local variables; they are created and destroyed automatically with each function call. The heap holds memory requested with «malloc»; it stays until «free» is called. Linked structures use the heap because they must outlive the function that created them and their size changes at run time.`],
  [R`What does malloc return when it fails, and what should you do?`,R`It returns «NULL». Check the pointer before using it and handle the error (print a message, stop).`],
  [R`What is a memory leak?`,R`Heap memory that is still reserved but no longer reachable through any pointer, so it can never be freed. Long-running programs that leak eventually run out of memory.`],
  [R`What is a dangling pointer? How do you avoid it?`,R`A pointer that still holds the address of memory that has been freed. Using it is undefined behaviour. Set pointers to «NULL» right after «free» and never use a pointer after freeing what it points to.`],
  [R`Why write sizeof(struct Node) instead of a number like 8?`,R`The size depends on the machine and compiler (ints and pointers can be 4 or 8 bytes, plus padding). «sizeof» always gives the correct size.`],
  [R`What is an abstract data type?`,R`A logical description of data and the operations on it, independent of implementation. Example: the Queue ADT (enqueue, dequeue, isEmpty, FIFO order) can be implemented with an array or a linked list.`]]},

singly:{blocks:[
  {t:'text',title:'Why linked lists?',body:[R`An array is one solid block: its size is fixed when you declare it, and inserting in the middle means shifting every later element. A linked list asks for one node at a time, anywhere on the heap, and joins them with pointers. It can grow and shrink while the program runs, and inserting means changing two arrows, not moving data.`,R`The price: there are no indexes. To reach the k-th node you must walk k links, and each node spends extra memory on its pointer.`]},
  {t:'table',title:'Array vs linked list',head:['','Array','Singly linked list'],rows:[
    ['Memory','One contiguous block','Separate nodes scattered on the heap'],
    ['Size','Fixed when declared','Grows and shrinks at run time'],
    ['Access k-th item','«O(1)»: «a[k]»','«O(n)»: walk k links'],
    ['Insert/delete at front','«O(n)»: shift everything','«O(1)»'],
    ['Insert/delete in the middle','«O(n)»: shift','«O(1)» once you hold the node before it (finding it is «O(n)»)'],
    ['Extra memory','None','One pointer per node'],
    ['Cache speed','Fast (neighbours are adjacent)','Slower (nodes are scattered)']]},
  {t:'list',title:'Kinds of linked list',items:[R`**Singly**: each node points to the next. One direction only.`,R`**Doubly**: next and prev pointers. Both directions (Sortie 02).`,R`**Circular singly**: the last node points back to the first (Sortie 03).`,R`**Circular doubly**: both: head’s prev is the tail, tail’s next is the head.`,R`**With a header (dummy) node**: an empty first node so insert/delete at the front never need a special case.`]},
  {t:'story',title:'Storyboard: insert 25 after the node p',view:'list',root:'head',base:t=>{const a=mkList(t,[10,20,30],'list');ptrOn(t,'head',a[0]);return {a};},steps:[
    [R`Before: «p» points at 20. We want 25 right after it.`,(t,c)=>{ptrOn(t,'p',c.a[1]);c.hl=[c.a[1]];}],

    [R`«n->next = p->next;» The new node points at 30 **first**, so the rest of the list is not lost.`,(t,c)=>{t.node(c.n,{next:c.a[2]});c.hl=[c.n];}],
    [R`«p->next = n;» Now 20 points at 25. Doing these two lines in the other order would lose 30!`,(t,c)=>{t.node(c.a[1],{next:c.n});c.hl=[c.a[1]];}]]},
  {t:'story',title:'Storyboard: delete the middle node',view:'list',root:'head',base:t=>{const a=mkList(t,[10,20,30],'list');ptrOn(t,'head',a[0]);return {a};},steps:[
    [R`Before: delete 20. «prev» points at 10, «cur» at 20.`,(t,c)=>{ptrOn(t,'prev',c.a[0]);ptrOn(t,'cur',c.a[1]);c.hl=[c.a[1]];}],
    [R`«prev->next = cur->next;» 10 now skips straight to 30.`,(t,c)=>{t.node(c.a[0],{next:c.a[2]});c.hl=[c.a[0]];}],
    [R`«free(cur);» 20’s memory is returned.`,(t,c)=>{t.free(c.a[1]);}]]},
  {t:'story',title:'Storyboard: reverse the list',view:'list',root:'head',base:t=>{const a=mkList(t,[1,2,3],'list');ptrOn(t,'head',a[0]);return {a};},steps:[
    [R`Start: «prev = NULL», «cur = head». Each round turns one arrow around.`,(t,c)=>{ptrOn(t,'cur',c.a[0]);c.hl=[c.a[0]];}],
    [R`Round 1: «nxt = cur->next; cur->next = prev;» Node 1 now points to NULL.`,(t,c)=>{t.node(c.a[0],{next:null});ptrOn(t,'prev',c.a[0]);ptrOn(t,'cur',c.a[1]);c.hl=[c.a[0]];}],

  {t:'list',title:'Where singly linked lists are used',items:[R`Implementing stacks and queues of unknown size.`,R`Polynomials (each node holds a coefficient and a power) and sparse matrices.`,R`Hash tables with chaining: each bucket is a list.`,R`Adjacency lists for graphs.`,R`Undo history, playlists, free-memory lists inside allocators.`]},
  {t:'table',title:'Advantages and disadvantages',head:['Advantages','Disadvantages'],rows:[
    ['Dynamic size: no need to know n in advance','No random access: reaching node k is «O(n)»'],

 qa:[
  [R`Differentiate between an array and a linked list.`,R`An array is a contiguous, fixed-size block with «O(1)» access by index but «O(n)» insertion/deletion (shifting). A linked list is a chain of dynamically allocated nodes: size changes at run time and insertion/deletion at a known position is «O(1)», but access by position is «O(n)» and each node needs an extra pointer.`],
  [R`Why is inserting at the beginning O(1) but at the end O(n)?`,R`The head is always known, so inserting there changes a fixed number of pointers. To insert at the end you must first walk to the last node, which takes n steps, unless you also keep a «tail» pointer.`],
  [R`What is a self-referential structure? Give an example.`,R`A structure that contains a pointer to a structure of the same type: «struct Node { int data; struct Node *next; };».`],
  [R`How do you know you have reached the end of a singly linked list?`,R`The current node’s «next» is «NULL» (or, when walking with «cur = cur->next», «cur» itself becomes «NULL»).`],
  [R`Write the steps to reverse a singly linked list.`,R`Use three pointers: «prev = NULL», «cur = head». While «cur != NULL»: «nxt = cur->next; cur->next = prev; prev = cur; cur = nxt;». Finally «head = prev». Time «O(n)», extra space «O(1)».`],
  [R`Why does deleting the first node need a special case?`,R`There is no node before it whose «next» can be changed. Instead the «head» pointer itself must move to the second node.`]]},

  {t:'list',title:'Where doubly linked lists are used',items:[R`Browser history: Back and Forward.`,R`Undo and redo in editors.`,R`Music players: previous and next track.`,R`LRU caches: move any item to the front in «O(1)».`,R`The C++ «std::list» and Java «LinkedList» are doubly linked.`]},
  {t:'table',title:'Advantages and disadvantages',head:['Advantages','Disadvantages'],rows:[['Traverse in both directions','Extra «prev» pointer in every node'],['Delete a known node in «O(1)»','Every insert/delete changes more pointers'],['Insert before a node easily','More places to make a mistake']]}],
 qa:[
  [R`What are the advantages of a doubly linked list over a singly linked list?`,R`It can be traversed in both directions, and a node you already hold can be deleted (or a new node inserted before it) in «O(1)», because its predecessor is available through «prev».`],
  [R`What are its disadvantages?`,R`Each node needs an extra pointer (more memory), and every insertion or deletion must update more pointers, so the code is longer and easier to get wrong.`],
  [R`How many pointers change when you insert a node in the middle?`,R`Four: the new node’s «prev» and «next», the next node’s «prev», and the previous node’s «next».`],
  [R`In a non-circular doubly linked list, what are head->prev and tail->next?`,R`Both are «NULL».`],
  [R`Give two real applications.`,R`Browser back/forward navigation and undo/redo stacks; also LRU caches and music playlists.`]]},

circular:{blocks:[
  {t:'table',title:'Where the last node points',head:['List type','last->next','first->prev','Stop walking when…'],rows:[

  {t:'text',title:'Why keep only a tail pointer',body:[R`In a circular list «tail->next» *is* the head. So one pointer, «tail», gives you both ends: inserting at the front and at the back are both «O(1)». Many textbooks keep only «last» for this reason.`]},
  {t:'story',title:'Storyboard: insert at the front using only tail',view:'clist',root:'head',base:t=>{const a=mkList(t,[1,2,3],'clist');ptrOn(t,'head',a[0]);ptrOn(t,'tail',a[2]);return {a};},steps:[

    [R`«n = new node(0)», not linked yet.`,(t,c)=>{c.n=t.malloc({data:0,next:null});ptrOn(t,'n',c.n);}],

  {t:'list',title:'Where circular lists are used',items:[R`**Round-robin CPU scheduling**: give each process a turn, forever.`,R`Turn order in multiplayer games.`,R`The **Josephus problem**: people in a circle, every k-th one leaves.`,R`Circular buffers for audio and network data.`,R`Repeat-all in music players.`]},
  {t:'table',title:'Advantages and disadvantages',head:['Advantages','Disadvantages'],rows:[['Any node can be the starting point','Easy to write an infinite loop'],['Both ends reachable from tail in «O(1)»','No NULL to mark the end; needs a different stop test'],['Natural for things that repeat in cycles','Deleting needs care to keep the ring closed']]}],
 qa:[
  [R`What is a circular linked list?`,R`A linked list in which the last node’s «next» points back to the first node instead of «NULL», so the nodes form a ring.`],
  [R`Why does while (p != NULL) fail on a circular list?`,R`There is no «NULL» in the ring, so the condition never becomes false and the loop runs forever. Stop when «p» returns to the starting node, usually with «do { … } while (p != head);».`],
  [R`Why is it common to keep a pointer to the last node instead of the first?`,R`Because «last->next» is the first node, a single pointer gives access to both ends, making insertion at the front and the back «O(1)».`],
  [R`What does a circular list with one node look like?`,R`The node points to itself: «head->next == head».`],
  [R`Name two applications.`,R`Round-robin scheduling and the Josephus problem; also circular buffers and turn-based games.`]]},

queue:{blocks:[
  {t:'text',title:'The Queue ADT',body:[R`A queue stores items in arrival order. Items are added at the **rear** and removed from the **front**: **FIFO**, first in, first out.`,R`Operations: «enqueue(x)» add at the rear · «dequeue()» remove from the front · «peek()» look at the front · «isEmpty()» · «isFull()» (array version only). Removing from an empty queue is **underflow**; adding to a full array queue is **overflow**.`]},
  {t:'table',title:'Stack vs queue',head:['','Stack','Queue'],rows:[['Order','LIFO: last in, first out','FIFO: first in, first out'],['Add','push, at the top','enqueue, at the rear'],['Remove','pop, from the top','dequeue, from the front'],['Pointers / indexes','«top»','«front» and «rear»'],['Examples','Undo, function calls, bracket matching','Printer jobs, CPU scheduling, BFS']]},
  {t:'table',title:'Three ways to build a queue',head:['Implementation','enqueue / dequeue','Notes'],rows:[
    ['Linear array','«O(1)»','After dequeues, slots at the front are wasted: “full” even with free space (false overflow).'],
    ['Circular array','«O(1)»','Indexes wrap with «(i + 1) % N», so freed slots are reused. Fixed capacity N.'],
    ['Linked list','«O(1)»','No fixed limit. Extra pointer per node. Must reset «rear» when it empties.']]},
  {t:'list',title:'Circular array formulas',items:[R`Next index: «i = (i + 1) % N».`,R`Start: «front = 0», «rear = -1», «count = 0».`,R`Empty: «count == 0». Full: «count == N».`,R`Without a count, a common rule leaves one slot empty: full when «(rear + 1) % N == front».`]},
  {t:'list',title:'Kinds of queue',items:[R`**Simple (linear) queue**: the basic FIFO line.`,R`**Circular queue**: an array queue whose indexes wrap around.`,R`**Priority queue**: the item with the highest priority leaves first, not the oldest (often built with a heap).`,R`**Deque** (double-ended queue): add and remove at both ends. *Input-restricted*: add at one end only. *Output-restricted*: remove at one end only.`]},
  {t:'story',title:'Storyboard: a linked queue from empty to empty',view:'list',root:'front',base:t=>{ptrOn(t,'front',null);ptrOn(t,'rear',null);return {};},steps:[
    [R`Empty queue: «front = rear = NULL».`,(t,c)=>{}],
    [R`«enqueue(10)»: the only node is both the front and the rear.`,(t,c)=>{c.a=t.malloc({data:10,next:null});ptrOn(t,'front',c.a);ptrOn(t,'rear',c.a);c.hl=[c.a];}],
    [R`«enqueue(20)»: «rear->next = n; rear = n;»`,(t,c)=>{c.b=t.malloc({data:20,next:null});t.node(c.a,{next:c.b});ptrOn(t,'rear',c.b);c.hl=[c.b];}],
    [R`«dequeue()» returns 10: «front = front->next;» then the old node is freed.`,(t,c)=>{ptrOn(t,'front',c.b);t.free(c.a);c.hl=[c.b];}],
    [R`«dequeue()» returns 20: front becomes NULL, so «rear = NULL» too. Empty again.`,(t,c)=>{ptrOn(t,'front',null);ptrOn(t,'rear',null);t.free(c.b);}]]},
  {t:'list',title:'Where queues are used',items:[R`CPU and printer scheduling: jobs are served in arrival order.`,R`Breadth-first search (BFS) in graphs, and level-order traversal of trees (Sortie 05).`,R`Keyboard and network buffers.`,R`Call centres and ticket systems.`]}],
 qa:[
  [R`Define a queue. Why is it called FIFO?`,R`A linear data structure where insertion happens at the rear and deletion at the front. The first element inserted is the first one removed: First In, First Out.`],
  [R`Differentiate a stack and a queue.`,R`A stack is LIFO with one end (top) for both push and pop. A queue is FIFO with two ends: enqueue at the rear, dequeue at the front.`],
  [R`Why is a circular queue better than a linear array queue?`,R`In a linear array queue, slots freed by dequeues at the front can never be reused, so the queue can report “full” while space is free. A circular queue wraps the indexes with modulo, reusing those slots.`],
  [R`What are overflow and underflow?`,R`Overflow: trying to enqueue into a full (array) queue. Underflow: trying to dequeue from an empty queue.`],
  [R`What are the full and empty conditions of a circular queue of size N?`,R`With a counter: empty when «count == 0», full when «count == N». Without one (keeping one slot empty): empty when «front == rear» (or a sentinel value), full when «(rear + 1) % N == front».`],
  [R`What is a priority queue? What is a deque?`,R`A priority queue removes the highest-priority element first rather than the oldest. A deque allows insertion and deletion at both ends.`]]},

tree:{blocks:[
  {t:'table',title:'Tree terminology (on the example tree)',head:['Term','Meaning','In the example'],rows:[
    ['Root','The top node; it has no parent','50'],['Parent / child','A node and the nodes directly below it','30 is the parent of 20 and 40'],['Siblings','Children of the same parent','20 and 40'],
    ['Leaf','A node with no children','20, 40, 60, 80'],['Internal node','A node with at least one child','50, 30, 70'],['Edge','The link between a parent and a child','n nodes always have n − 1 edges'],
    ['Depth of a node','Edges from the root down to it','depth(20) = 2'],['Height of the tree','Edges on the longest root-to-leaf path','2'],['Level','Same as depth: root is level 0','40 is on level 2'],
    ['Degree','Number of children of a node','Binary tree: at most 2'],['Subtree','A node together with all its descendants','30, 20, 40']]},
  {t:'table',title:'Kinds of binary tree',head:['Type','Rule'],rows:[
    ['Binary tree','Every node has at most 2 children.'],['Full (strict)','Every node has 0 or 2 children.'],['Complete','Every level is full except possibly the last, which is filled from the left.'],
    ['Perfect','All internal nodes have 2 children and all leaves are on the same level.'],['Skewed (degenerate)','Every node has one child: it behaves like a linked list.'],
    ['Binary search tree','Left subtree < node ≤ right subtree, at every node.'],['Balanced (AVL, red-black)','Keeps the height «O(log n)» by rotating after inserts and deletes.']]},
  {t:'list',title:'Useful formulas (height counted in edges, root at level 0)',items:[R`Maximum nodes on level i: «2^i».`,R`Maximum nodes in a tree of height h: «2^(h+1) − 1».`,R`n nodes have exactly «n − 1» edges.`,R`Minimum height for n nodes: «⌈log₂(n + 1)⌉ − 1».`,R`In a full binary tree: leaves = internal nodes + 1.`]},
  {t:'table',title:'Traversals of the example tree',head:['Traversal','Order','Result'],rows:[
    ['Inorder','Left, Node, Right','20 30 40 50 60 70 80 (sorted)'],['Preorder','Node, Left, Right','50 30 20 40 70 60 80'],
    ['Postorder','Left, Right, Node','20 40 30 60 80 70 50'],['Level order (BFS)','Level by level, using a queue','50 30 70 20 40 60 80']]},
  {t:'story',title:'Storyboard: delete case 1, a leaf (20)',view:'tree',root:'root',base:t=>{const [r,m]=mkTree(t,[50,30,70,20,40,60,80]);ptrOn(t,'root',r);return {m};},steps:[
    [R`20 has no children.`,(t,c)=>{c.hl=[c.m[20]];}],
    [R`Set its parent’s link to NULL («30->left = NULL») and «free» it.`,(t,c)=>{t.node(c.m[30],{left:null});t.free(c.m[20]);c.hl=[c.m[30]];}]]},
  {t:'story',title:'Storyboard: delete case 2, one child (30)',view:'tree',root:'root',base:t=>{const [r,m]=mkTree(t,[50,30,70,20,60]);ptrOn(t,'root',r);return {m};},steps:[
    [R`30 has only one child, 20.`,(t,c)=>{c.hl=[c.m[30]];}],
    [R`Link the parent straight to that child («50->left = 20») and «free» 30. The BST rule still holds.`,(t,c)=>{t.node(c.m[50],{left:c.m[20]});t.free(c.m[30]);c.hl=[c.m[50],c.m[20]];}]]},
  {t:'story',title:'Storyboard: delete case 3, two children (50)',view:'tree',root:'root',base:t=>{const [r,m]=mkTree(t,[50,30,70,20,40,60,80]);ptrOn(t,'root',r);return {m};},steps:[
    [R`50 has two children, so we cannot just unlink it.`,(t,c)=>{c.hl=[c.m[50]];}],
    [R`Find the **inorder successor**: the smallest value in the right subtree (go right once, then left as far as possible): 60.`,(t,c)=>{c.hl=[c.m[60]];}],
    [R`Copy 60 into the node being deleted.`,(t,c)=>{t.node(c.m[50],{data:60});c.hl=[c.m[50]];}],
    [R`Delete the old 60 node from the right subtree. It has at most one child, so this is case 1 or 2.`,(t,c)=>{t.node(c.m[70],{left:null});t.free(c.m[60]);c.hl=[c.m[50]];}]]},
  {t:'table',title:'BST cost',head:['Operation','Balanced tree','Skewed tree (worst case)'],rows:[['Search','«O(log n)»','«O(n)»'],['Insert','«O(log n)»','«O(n)»'],['Delete','«O(log n)»','«O(n)»'],['Traversal','«O(n)»','«O(n)»']]},
  {t:'list',title:'Where trees are used',items:[R`File systems: folders inside folders.`,R`Database indexes (B-trees) and in-memory maps (balanced BSTs).`,R`Expression trees in compilers: «(a + b) * c».`,R`Decision trees, game trees, the HTML DOM.`,R`Heaps (priority queues) and tries (autocomplete).`]}],
 qa:[
  [R`Define root, leaf, height and depth.`,R`Root: the top node with no parent. Leaf: a node with no children. Depth of a node: the number of edges from the root to it. Height of a tree: the number of edges on the longest path from the root to a leaf.`],
  [R`What is the difference between a binary tree and a binary search tree?`,R`A binary tree only limits each node to two children. A BST adds an ordering rule: every value in a node’s left subtree is smaller than it and every value in its right subtree is larger (or equal).`],
  [R`Distinguish full, complete and perfect binary trees.`,R`Full: every node has 0 or 2 children. Complete: all levels full except maybe the last, filled from the left. Perfect: every internal node has 2 children and all leaves are at the same level (it is both full and complete).`],
  [R`Why does inorder traversal of a BST give sorted output?`,R`Inorder visits the left subtree (all smaller values), then the node, then the right subtree (all larger values), at every node. So values come out in increasing order.`],
  [R`What is the worst-case search time in a BST and when does it happen?`,R`«O(n)», when the tree is skewed, for example after inserting already-sorted data. A balanced BST keeps it at «O(log n)».`],
  [R`How do you delete a node that has two children?`,R`Replace its value with its inorder successor (smallest value in the right subtree) or inorder predecessor (largest in the left subtree), then delete that successor/predecessor node, which has at most one child.`],
  [R`Which traversal uses a queue?`,R`Level-order traversal (breadth-first): enqueue the root, then repeatedly dequeue a node, visit it, and enqueue its children.`],
  [R`What is the maximum number of nodes in a binary tree of height h?`,R`«2^(h+1) − 1» (counting height in edges, so a single node has height 0).`]]}
